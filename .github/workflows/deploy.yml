name: Deploy to cloudtype
on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: extra_bottle/my-project
          stage: main
          yaml: |
            name: clova-iot
            app: node@24
            options:
              ports: 443
              install: npm ci              
              start: npm start
              env:
                - name: KEY_B64
                  value: ${{ toJSON(secrets.KEY_B64) }}
                - name: CERT_B64
                  value: ${{ toJSON(secrets.CERT_B64) }}
                - name: CA_B64
                  value: ${{ toJSON(secrets.CA_B64) }}
                - name: CLIENT_ID
                  value: ${{ toJSON(secrets.CLIENT_ID) }}
                - name: CLOVA_ID
                  value: ${{ toJSON(secrets.CLOVA_ID) }}
                - name: CLOVA_SECRET
                  value: ${{ toJSON(secrets.CLOVA_SECRET) }}
                - name: FINISH_MSG
                  value: ${{ toJSON(secrets.FINISH_MSG) }}
                - name: ERROR_MSG
                  value: ${{ toJSON(secrets.ERROR_MSG) }}
                - name: MQTT_HOST
                  value: ${{ toJSON(secrets.MQTT_HOST) }}
                - name: SUB_INBOX
                  value: ${{ toJSON(secrets.SUB_INBOX) }}
                - name: SUB_PUSH
                  value: ${{ toJSON(secrets.SUB_PUSH) }}
                - name: SERVER_PORT
                  value: ${{ toJSON(secrets.SERVER_PORT) }}
                - name: DOMAIN
                  value: ${{ toJSON(secrets.DOMAIN) }}
                - name: CLEANER_MSG
                  value: ${{ toJSON(secrets.CLEANER_MSG) }}
                - name: CONDITIONER_MSG
                  value: ${{ toJSON(secrets.CONDITIONER_MSG) }}
                - name: GEMINI_API_KEY
                  value: ${{ toJSON(secrets.GEMINI_API_KEY) }}
                - name: LG_THINQ_PAT
                  value: ${{ toJSON(secrets.LG_THINQ_PAT) }}
                - name: AIR_CON_DEVICE_ID
                  value: ${{ toJSON(secrets.AIR_CON_DEVICE_ID) }}
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
