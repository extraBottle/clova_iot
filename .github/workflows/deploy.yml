name: Deploy to cloudtype
on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Diagnose Cloudtype API access
        env:
          CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.CLOUDTYPE_TOKEN;
          if (!token) { console.error('CLOUDTYPE_TOKEN is missing'); process.exit(1); }
          console.log('CLOUDTYPE_TOKEN present; outer whitespace: ' + (token !== token.trim()));
          for (const scope of ['$user', 'extra_bottle']) {
            const url = `https://api.cloudtype.io/scope/${scope}/deploykey?url=${encodeURIComponent('git@github.com:extraBottle/clova_iot.git')}`;
            try {
              const response = await fetch(url, {
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                signal: AbortSignal.timeout(20000)
              });
              console.log(`Cloudtype direct GET scope=${scope}: HTTP ${response.status}`);
              // Never log response contents: a successful response contains deploy key metadata.
              await response.body?.cancel();
            } catch {
              console.log(`Cloudtype direct GET scope=${scope}: network or request error`);
            }
          }
          JS
      - name: Connect deploy key
        uses: cloudtype-github-actions/connect@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          ghtoken: ${{ secrets.GHP_TOKEN }}
          scope: extra_bottle
          readOnly: 'true'
      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: extra_bottle/my-project
          stage: main
          yaml: |
            name: clova-iot
            app: node@24
            options:
              ports: 443
              install: npm ci              
              start: npm start
              env:
                - name: KEY_B64
                  value: '${{ secrets.KEY_B64 }}'
                - name: CERT_B64
                  value: '${{ secrets.CERT_B64 }}'
                - name: CA_B64
                  value: '${{ secrets.CA_B64 }}'
                - name: CLIENT_ID
                  secret: CLIENT_ID
                - name: CLOVA_ID
                  secret: CLOVA_ID
                - name: CLOVA_SECRET
                  secret: CLOVA_SECRET                
                - name: FINISH_MSG
                  secret: FINISH_MSG
                - name: ERROR_MSG
                  secret: ERROR_MSG                
                - name: MQTT_HOST
                  secret: MQTT_HOST
                - name: SUB_INBOX
                  secret: SUB_INBOX
                - name: SUB_PUSH
                  secret: SUB_PUSH
                - name: SERVER_PORT
                  secret: SERVER_PORT
                - name: DOMAIN
                  secret: DOMAIN
                - name: CLEANER_MSG
                  secret: CLEANER_MSG
                - name: CONDITIONER_MSG
                  secret: CONDITIONER_MSG
                - name: GEMINI_API_KEY
                  secret: GEMINI_API_KEY
                - name: LG_THINQ_PAT
                  value: '${{ secrets.LG_THINQ_PAT }}'
                - name: AIR_CON_DEVICE_ID
                  secret: AIR_CON_DEVICE_ID
              buildenv: []
            context:
              git:
                url: git@github.com:${{ github.repository }}.git
                ref: ${{ github.ref }}
